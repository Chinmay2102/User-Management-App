<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #cnt {
            padding: 20px;
            display: flex;
            /* justify-content: center; */
            gap: 20px;
            flex-wrap: wrap;
            background-color: #f0f0f0;
        }
    
        .card {
            width: 280px;
            min-height: 220px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
    
        .top {
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
    
        .bottom {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
    
        .bottom > label {
            font-weight: bold;
            color: #3498db;
            margin-top: 6px;
        }
    
        .bottom h1 {
            margin: 0;
            padding: 4px 0;
            font-size: 0.9rem;
            color: #2c3e50;
            border-bottom: 1px solid #eee;
        }
    
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    
        .top h1 {
            margin: 0;
            font-size: 1.4rem;
            color: #2c3e50;
        }
    
        @media (max-width: 768px) {
            #adduserbtn {
                width: auto; 
                min-width: 80px; 
                font-size: 14px; 
                padding: 0 8px;
            }
        }

        #addusers {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 25px;
        width: 400px;
        min-height: 300px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
        display: none;
        z-index: 1000;
        }

        .innercnt {
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding: 15px;
        }

        .innercnt input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }

        .innercnt label {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: -10px;
        }

        #submitBtn{
            margin-top: 15px; 
            padding: 10px; 
            background: #3498db; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer;
        }

        #closebtn{
            position: absolute;
            right: 10px;
            top: 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: bold;
            color: #666;
        }
        

        header{
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
        }

        #Uinput{
            height: 23px;
            width: 30%;
            outline: none;
            border: none;
            border-radius: 5px;
            margin-bottom: 8px;
            box-shadow: -3px -2px 1px #3498db;
        }
        
        #Uinput::placeholder{
            font-size: 14px;
        }
        
        #adduserbtn{
            height: 25px;
            width: 10%;
            border: none;
            background-color: #fff;
            color: #3498db;
            border-radius: 3px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 3px;
            box-shadow: -3px -2px 1px #3498db;
            
        }

        #adduserbtn:hover{
            text-decoration: underline;
        }

    </style>
</head>
<body>


    <header>
        
        <input type="text"  id="Uinput" placeholder="Search">
        <button id="adduserbtn">Add User</button>
        <div id="addusers">
            <button id="closebtn">X</button>
            <div class="innercnt">

                <label>id:</label>
                <input type="text" id="newuid">
        
                <label>Name:</label>
                <input type="text" name="" id="newun">
        
                <label>phone:</label>
                <input type="text" id="newup">
        
                <label>email:</label>
                <input type="email" id="newuem">
        
                <label>company name:</label>
                <input type="text" id="newcn">

                <button id="submitBtn">Submit</button>
            </div>
        </div>
    </header>

    <div id="cnt">    
    </div>
    

    <script src="index.js"></script>
</body>
</html>

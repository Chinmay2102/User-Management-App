<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #usercnt{
            width: 100%;
            height:80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 280px;
            min-height: 220px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
    
        .top {
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
    
        .bottom {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
    
        .bottom > label {
            font-weight: bold;
            color: #3498db;
            margin-top: 6px;
        }
    
        .bottom h1 {
            margin: 0;
            padding: 4px 0;
            font-size: 0.9rem;
            color: #2c3e50;
            border-bottom: 1px solid #eee;
        }
    
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    
        .top h1 {
            margin: 0;
            font-size: 1.4rem;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    
    <div id="usercnt"></div>

    <script src="user.js"></script>
</body>
</html>
